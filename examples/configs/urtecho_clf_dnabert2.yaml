# Urtecho 2020 E. coli promoter MPRA -> active/inactive classification,
# fine-tuning a pretrained DNABERT-2 backbone. The pretrained sibling of the
# from-scratch cells: only the tokenizer/model block changes; corpus, task, and
# the fixed column split are identical, so the held-out AUPRC is directly
# comparable. This is the capability the authors did not have in 2020, when
# their ceiling was a hyperparameter-searched DragoNN CNN.
# Prepare the corpus first:  python examples/prepare_urtecho_promoters.py
# Prepare a Triton-free DNABERT-2 first (Apple Silicon / CPU):
#   uv run --with huggingface_hub python examples/prepare_dnabert2.py
# which populates data/dnabert2 (the backbone path below).
seed: 42
output_dir: runs/urtecho_clf_dnabert2

corpus:
  source: table
  path: data/urtecho_promoters/urtecho_promoters.csv
  sequence_column: sequence
  label_column: active
  id_column: id
  alphabet: dna
  cache_dir: .synbiotorch_cache

tokenizer:
  kind: hf
  model_name: data/dnabert2
  max_length: 64

encoder:
  kind: sequence

model:
  from_scratch: false
  backbone: data/dnabert2
  dropout: 0.1

task:
  kind: supervised
  objective: classification
  num_classes: 2

splits:
  strategy: column
  column: split

train:
  batch_size: 32
  epochs: 4
  lr: 2.0e-5
  weight_decay: 0.01
  amp: false
  early_stop:
    monitor: val_loss
    mode: min
    patience: 2
